
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 새해 로또 번호 추첨기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>2026 새해 로또 번호 추첨기</h1>
        
        <div id="numbers-container" class="numbers-container"></div>
        <button id="generate-button" class="generate-button">번호 생성</button>
    </div>

    <div class="container info-container">
        <h2>실시간 정보</h2>
        <div class="button-group">
            <button id="getWeatherBtn" class="info-button">서울 날씨</button>
            <button id="getKosdaqBtn" class="info-button">코스닥 지수</button>
        </div>
        <div id="weatherInfo" class="info-box"></div>
        <div id="kosdaqInfo" class="info-box"></div>
    </div>

    <div class="container contact-container">
        <h2>제휴 문의</h2>
        <form action="https://formspree.io/f/xbdaoqod" method="POST" class="contact-form">
            <div class="form-group">
                <label for="name">이름:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">이메일:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="company">회사명 (선택 사항):</label>
                <input type="text" id="company" name="company">
            </div>
            <div class="form-group">
                <label for="message">문의 내용:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="submit-button">문의하기</button>
        </form>
    </div>
    <script src="main.js"></script>
</body>
</html>
